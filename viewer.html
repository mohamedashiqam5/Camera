<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch Live</title>
<style>body{font-family:system-ui;padding:20px}video{width:100%;background:#000;border-radius:12px}#status{margin:12px 0}</style>
</head>
<body>
<h2>Live Video</h2>
<p id="status">Connecting…</p>
<video id="remote" autoplay playsinline controls></video>
<script>
const room = new URLSearchParams(location.search).get("room") || "demo";
let ws, pc;
const status=m=>document.getElementById("status").textContent=m;

function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}`);
  ws.onopen=()=>{
    ws.send(JSON.stringify({type:"join",room}));
    ws.send(JSON.stringify({type:"viewer-ready"}));
  };
  ws.onmessage=async e=>{
    const m=JSON.parse(e.data);
    if(m.type==="offer"){
      pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
      pc.ontrack=e=>{
        document.getElementById("remote").srcObject=e.streams[0];
        status("Live video connected.");
      };
      pc.onicecandidate=e=>{
        if(e.candidate)ws.send(JSON.stringify({type:"ice",candidate:e.candidate}));
      };
      await pc.setRemoteDescription(m.offer);
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({type:"answer",answer:pc.localDescription}));
    } else if(m.type==="ice" && pc){
      try{await pc.addIceCandidate(m.candidate)}catch{}
    }
  };
  ws.onclose=()=>status("Connection closed.");
}
connect();
</script>
</body>
</html>
