<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera</title>
<style>body{font-family:system-ui;padding:20px}button{font-size:18px;padding:14px;width:100%}video{width:100%;background:#000;border-radius:12px;margin-top:12px}.ok{color:green}</style>
</head>
<body>
<h2>Camera</h2>
<p>Tap the button, then choose <b>Allow</b> for camera and microphone.</p>
<button id="start">Allow Camera & Microphone</button>
<video id="preview" autoplay playsinline muted></video>
<p id="status"></p>
<script>
const room = new URLSearchParams(location.search).get("room") || "demo";
let ws, pc, stream;
const status = m => document.getElementById("status").textContent=m;

function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}`);
  ws.onopen=()=>ws.send(JSON.stringify({type:"join",room}));
  ws.onmessage=async e=>{
    const m=JSON.parse(e.data);
    if(m.type==="viewer-ready" || m.type==="peer-joined"){
      await makeOffer();
    } else if(m.type==="answer"){
      await pc.setRemoteDescription(m.answer);
    } else if(m.type==="ice" && pc){
      try{await pc.addIceCandidate(m.candidate)}catch{}
    }
  };
}
async function makeOffer(){
  if(!stream) return;
  if(pc) pc.close();
  pc=new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}]
  });
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.onicecandidate=e=>{if(e.candidate)ws.send(JSON.stringify({type:"ice",candidate:e.candidate}))};
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({type:"offer",offer:pc.localDescription}));
}
document.getElementById("start").onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    document.getElementById("preview").srcObject=stream;
    status("Camera is active. Keep this page open.");
    connect();
  }catch(e){status("Camera/microphone permission was denied or unavailable: "+e.message)}
};
</script>
</body>
</html>
